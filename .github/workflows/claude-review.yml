name: Claude Code Review

# Two jobs:
#   review  - automatic review of every non-draft PR (prompt-driven automation mode)
#   respond - answers "@claude" mentions on PRs (interactive mode; no fixed prompt,
#             so Claude acts on what the commenter asked)
#
# Auth: set ONE repo secret.
#   CLAUDE_CODE_OAUTH_TOKEN - uses your Claude subscription; create with `claude setup-token`
#   ANTHROPIC_API_KEY       - pay-per-token API billing
# GitHub access uses the workflow's own GITHUB_TOKEN, so the Claude GitHub App is not required.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # A new push to the same PR supersedes the in-flight review; comment threads run independently.
  group: claude-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.comment.id || 'push' }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check Claude auth secret
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH" ] && [ -z "$API_KEY" ]; then
            echo "::error::No Claude credentials. Add repo secret CLAUDE_CODE_OAUTH_TOKEN (run 'claude setup-token') or ANTHROPIC_API_KEY."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Review PR
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request to PrimeEdit, a native Linux text editor in C++17 / Qt 6
            (CMake build; core/ = piece table, documents, encodings, large files, LSP, plugins,
            remote editing; ui/ = editor widget, main window, panels; syntax/ = highlighting).

            Focus, in priority order:
            1. Data safety: anything that can lose or corrupt user text (saves that are not
               atomic, encoding/BOM/line-ending round-trips, undo/redo, session restore, closing
               tabs or quitting with unsaved changes).
            2. Crashes and lifetime: null/dangling pointers, Qt parent ownership, deleteLater and
               signal ordering, connections that accumulate, thread safety around QtConcurrent.
            3. Security: QProcess or shell commands built from file names, branch names, hosts or
               comments; credentials stored in plain text; plugins or LSP servers started from
               untrusted paths; markdown preview loading scripts or remote content.
            4. Performance targets: startup under 1 s, files over 1 GB, under 100 MB RAM with
               10 files open. Flag whole-file copies, full-document passes on every keystroke.
            5. Tests: a bug fix should come with a test that fails without it.
            6. Project standards: functions at most 50 lines, files at most 500 lines, at most 5
               parameters, no dead code, no qDebug/printf left in, comments explain why.

            Report only real problems, each with file:line, the concrete failure, and a fix.
            Use inline comments for specific lines and one summary comment overall.
            Skip formatting nits. If the change looks good, say so in one or two sentences.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  respond:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check Claude auth secret
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH" ] && [ -z "$API_KEY" ]; then
            echo "::error::No Claude credentials. Add repo secret CLAUDE_CODE_OAUTH_TOKEN (run 'claude setup-token') or ANTHROPIC_API_KEY."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Respond to @claude
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: |
            --model claude-opus-5-5
            --max-turns 30
