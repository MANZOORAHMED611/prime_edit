name: Build and test

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev libqt6svg6-dev libgl-dev libicu-dev cmake build-essential

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # AddressSanitizer + UndefinedBehaviorSanitizer over every suite (spec
  # 2026-11-26-phase1-data-loss-fixes.md, section 9.3 command 3).
  #
  # EXPECTED RED until T1.5 merges: crash_test fails on its one known case
  # ("Untitled with content, switch theme..."), the D4 cache bug T1.5 fixes.
  # That failure is deliberately NOT masked: no WILL_FAIL, no test exclusion,
  # no continue-on-error. The job must be green on the merged Phase 1 branch
  # before the PR is opened (section 9.5).
  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev libqt6svg6-dev libgl-dev libicu-dev cmake build-essential

      - name: Configure
        run: >-
          cmake -S . -B asan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build asan -j"$(nproc)"

      - name: Test
        run: |
          set -o pipefail
          ctest --test-dir asan --output-on-failure 2>&1 | tee asan/ctest.log

      # Runs even when a test failed, so a sanitizer report is always named,
      # separately from ordinary test failures.
      - name: Sanitizer reports
        if: always()
        run: |
          count=$(grep -c 'ERROR: AddressSanitizer\|ERROR: LeakSanitizer\|runtime error:' asan/ctest.log || true)
          echo "sanitizer reports: ${count}"
          test "${count}" -eq 0
